# Include ONLY inside the existing HTTPS server block for the chosen domain.
# A trailing slash is required for the browser's relative asset/API URLs.
location = /frankenfly {
    return 308 /frankenfly/$is_args$args;
}

# ^~ keeps this app's assets out of unrelated regex locations on the host site.
location ^~ /frankenfly/ {
    # The trailing slash strips /frankenfly/ before sending to the backend.
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_cache off;
    expires off;
    client_max_body_size 2k;
}
